<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>HR Sync - Add Employee</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#fcdeb5",
                        "secondary-fixed": "#d8e2ff",
                        "tertiary": "#000000",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#dcd9db",
                        "on-primary": "#ffffff",
                        "surface-container": "#f0edef",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f6f3f5",
                        "primary": "#000000",
                        "on-tertiary-fixed-variant": "#574425",
                        "surface": "#fcf8fa",
                        "surface-container-high": "#eae7e9",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#131b2e",
                        "on-tertiary-container": "#98805d",
                        "inverse-surface": "#303032",
                        "on-primary-container": "#7c839b",
                        "on-secondary-container": "#fefcff",
                        "surface-tint": "#565e74",
                        "inverse-primary": "#bec6e0",
                        "primary-container": "#131b2e",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-tertiary-fixed": "#271901",
                        "on-background": "#1b1b1d",
                        "primary-fixed": "#dae2fd",
                        "outline": "#76777d",
                        "on-error": "#ffffff",
                        "surface-bright": "#fcf8fa",
                        "on-surface": "#1b1b1d",
                        "outline-variant": "#c6c6cd",
                        "on-surface-variant": "#45464d",
                        "on-secondary-fixed": "#001a42",
                        "background": "#fcf8fa",
                        "tertiary-container": "#271901",
                        "tertiary-fixed-dim": "#dec29a",
                        "secondary-container": "#2170e4",
                        "surface-variant": "#e4e2e4",
                        "secondary-fixed-dim": "#adc6ff",
                        "inverse-on-surface": "#f3f0f2",
                        "surface-container-highest": "#e4e2e4",
                        "primary-fixed-dim": "#bec6e0",
                        "on-tertiary": "#ffffff",
                        "secondary": "#0058be",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#004395",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "32px",
                        "xl": "32px",
                        "base": "4px",
                        "gutter": "20px",
                        "sm": "8px",
                        "xs": "4px",
                        "lg": "24px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "data-table": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "data-table": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface flex min-h-screen">
<!-- Navigation suppressed as this is a focused task/form screen -->
<main class="flex-1 overflow-y-auto">
<!-- Header -->
<header class="bg-surface border-b border-outline-variant/30 sticky top-0 z-10 px-lg h-16 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-md">
<a href="{{ url_for('hr_directory') }}" class="text-on-surface-variant hover:bg-surface-container rounded-full p-2 transition-colors inline-flex items-center" title="Back to Directory">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-headline-md text-headline-md text-primary">Add New Employee</h1>
</div>
<div class="flex gap-md">
<a href="{{ url_for('hr_directory') }}" class="font-label-md text-label-md text-secondary px-4 py-2 hover:bg-secondary-container/10 rounded transition-colors inline-flex items-center">
                    Cancel
                </a>
<button type="submit" form="addEmployeeForm" class="font-label-md text-label-md bg-secondary text-on-secondary px-4 py-2 rounded hover:brightness-90 transition-all shadow-sm">
                    Save Employee
                </button>
</div>
</header>
<div class="p-container-margin max-w-5xl mx-auto space-y-xl">
<form id="addEmployeeForm" action="{{ url_for('hr_add_employee') }}" method="POST" class="space-y-xl">
<!-- Section 1: Basic Information -->
<div class="bg-surface-container-lowest rounded-xl p-lg border border-outline-variant/30 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.04)]">
<div class="mb-lg border-b border-outline-variant/30 pb-4">
<h2 class="font-headline-md text-headline-md text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-secondary">person</span>
                            Basic Information
                        </h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant">Full Name *</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/50 transition-all" placeholder="Enter full name" type="text">
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant">Email Address *</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/50 transition-all" placeholder="name@company.com" type="email">
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant">Phone Number</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/50 transition-all" placeholder="+1 (555) 000-0000" type="tel">
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant flex justify-between">
                                Employee ID *
                                <span class="text-xs text-secondary cursor-pointer hover:underline">Auto-generate</span>
</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/50 transition-all" placeholder="e.g. EMP-001" type="text">
</div>
</div>
</div>
<!-- Section 2: Employment Details -->
<div class="bg-surface-container-lowest rounded-xl p-lg border border-outline-variant/30 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.04)]">
<div class="mb-lg border-b border-outline-variant/30 pb-4">
<h2 class="font-headline-md text-headline-md text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-secondary">work</span>
                            Employment Details
                        </h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant font-medium">Department *</label>
<div class="relative group">
<select class="w-full bg-surface-container-lowest border border-outline-variant hover:border-secondary hover:bg-secondary/5 rounded px-3 py-2 font-body-md text-body-md text-on-surface font-medium appearance-none focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all cursor-pointer">
<option disabled="" selected="" value="">Select department</option>
<option>Engineering</option>
<option>Design</option>
<option>Marketing</option>
<option>Human Resources</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant group-hover:text-secondary pointer-events-none transition-colors">expand_more</span>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant font-medium">Designation *</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant hover:border-secondary hover:bg-secondary/5 rounded px-3 py-2 font-body-md text-body-md text-on-surface font-medium focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all" placeholder="e.g. Senior Developer" type="text">
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant font-medium">Reporting Manager</label>
<div class="relative group">
<select class="w-full bg-surface-container-lowest border border-outline-variant hover:border-secondary hover:bg-secondary/5 rounded px-3 py-2 font-body-md text-body-md text-on-surface font-medium appearance-none focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all cursor-pointer">
<option disabled="" selected="" value="">Select manager</option>
<option>Jane Doe (Engineering Dir)</option>
<option>John Smith (CTO)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant group-hover:text-secondary pointer-events-none transition-colors">expand_more</span>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant font-medium">Joining Date *</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border border-outline-variant hover:border-secondary hover:bg-secondary/5 rounded px-3 py-2 font-body-md text-body-md text-on-surface font-medium focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all cursor-text appearance-none" type="date">
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant font-medium">Employment Type</label>
<div class="flex gap-4 mt-2">
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="text-secondary focus:ring-secondary" name="empType" type="radio">
<span class="font-body-md text-body-md text-on-surface font-medium">Full-time</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="text-secondary focus:ring-secondary" name="empType" type="radio">
<span class="font-body-md text-body-md text-on-surface font-medium">Contract</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="text-secondary focus:ring-secondary" name="empType" type="radio">
<span class="font-body-md text-body-md text-on-surface font-medium">Intern</span>
</label>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant font-medium">System Role</label>
<div class="relative group">
<select class="w-full bg-surface-container-lowest border border-outline-variant hover:border-secondary hover:bg-secondary/5 rounded px-3 py-2 font-body-md text-body-md text-on-surface font-medium appearance-none focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all cursor-pointer">
<option>Employee</option>
<option>HR</option>
<option>Admin</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant group-hover:text-secondary pointer-events-none transition-colors">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Section 3: System & Access -->
<div class="bg-surface-container-lowest rounded-xl p-lg border border-outline-variant/30 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.04)] mb-xl">
<div class="mb-lg border-b border-outline-variant/30 pb-4">
<h2 class="font-headline-md text-headline-md text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-secondary">security</span>
                            System Access &amp; Policies
                        </h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant font-medium">Leave Policy</label>
<div class="relative group">
<select class="w-full bg-surface-container-lowest border border-outline-variant hover:border-secondary hover:bg-secondary/5 rounded px-3 py-2 font-body-md text-body-md text-on-surface font-medium appearance-none focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all cursor-pointer">
<option>Standard Corporate Policy (20 Days)</option>
<option>Executive Policy (30 Days)</option>
<option>Contractor Policy (0 Days)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant group-hover:text-secondary pointer-events-none transition-colors">expand_more</span>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant">Initial Password *</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/50 transition-all" placeholder="••••••••" type="password">
</div><div class="space-y-4">
<label class="flex items-center gap-3 cursor-pointer p-3 border border-outline-variant/30 rounded bg-surface hover:bg-surface-container transition-colors">
<input checked="" class="text-secondary rounded focus:ring-secondary w-5 h-5" type="checkbox">
<div>
<div class="font-label-md text-label-md text-on-surface">Send Welcome Email</div>
<div class="font-body-md text-xs text-on-surface-variant mt-1">Automatically send invitation link to setup password</div>
</div>
</label>
</div>
</div>
</div>
</form>
</div>
</main>


</body></html>
